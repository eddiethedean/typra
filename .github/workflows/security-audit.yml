name: Security audit

on:
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 6 * * 1" # weekly
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  rustsec:
    name: RustSec (cargo-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Install Rust
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
      - name: Install cargo-audit
        uses: taiki-e/install-action@e49978b799e49ff429d162b7a30601a569ab6538
        with:
          tool: cargo-audit
      - name: Run cargo audit
        run: cargo audit

  pipaudit:
    name: Python (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
      - name: Install Python
        uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
      - name: Install pip-audit
        run: python -m pip install --upgrade "pip==26.0" "pip-audit>=2,<3"
      - name: Audit python/modelvault environment
        run: |
          python -m pip install -U "maturin>=1.5,<2" "pip-audit>=2,<3"
          python -m venv .venv-audit
          .venv-audit/bin/pip install -U pip
          .venv-audit/bin/maturin develop --release -m python/modelvault
          .venv-audit/bin/pip install -r docs/requirements.txt
          # CVE-2026-3219: transitive doc/build tooling; review on 2026-09-01
          .venv-audit/bin/pip-audit --ignore-vuln CVE-2026-3219
