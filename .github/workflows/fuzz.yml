name: Fuzz (smoke)

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "0 7 * * 1" # weekly
  workflow_dispatch: {}

permissions:
  contents: read

jobs:
  fuzz-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1

      - name: Install Rust (nightly for cargo-fuzz/ASAN)
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        with:
          toolchain: nightly

      - name: Cache cargo
        uses: Swatinem/rust-cache@e18b497796c12c097a38f9edb9d0641fb99eee32

      - name: Install cargo-fuzz
        uses: taiki-e/install-action@e49978b799e49ff429d162b7a30601a569ab6538
        with:
          tool: cargo-fuzz

      - name: Run fuzz targets (short budget)
        working-directory: fuzz
        run: |
          set -euo pipefail
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu decode_file_header -- -max_total_time=10
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu decode_superblock -- -max_total_time=10
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu decode_segment_header -- -max_total_time=10
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu scan_segments_vecstore -- -max_total_time=10
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu decode_catalog_payload -- -max_total_time=10
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu decode_record_payload_v2 -- -max_total_time=10
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu decode_record_payload_v3 -- -max_total_time=10
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu decode_checkpoint_payload -- -max_total_time=10
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu decode_index_payload -- -max_total_time=10
          cargo +nightly fuzz run --target x86_64-unknown-linux-gnu parse_sql_select -- -max_total_time=10

