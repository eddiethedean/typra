site_name: ModelVault
site_description: Schema-first embedded database for application models — validation, indexes, migrations, single-file deployment in Python and Rust
site_url: https://modelvault.readthedocs.io/
repo_url: https://github.com/eddiethedean/modelvault
repo_name: eddiethedean/modelvault
edit_uri: edit/main/docs/

theme:
  name: material
  language: en
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/brightness-4
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.instant.progress
    - navigation.tracking
    - navigation.tabs
    - navigation.tabs.sticky
    - navigation.sections
    - navigation.top
    - navigation.indexes
    - navigation.footer
    - navigation.path
    - content.code.copy
    - content.code.annotate
    - search.suggest
    - search.highlight
    - toc.follow
  icon:
    repo: fontawesome/brands/github

extra_css:
  - stylesheets/extra.css

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - tables
  - toc:
      permalink: true
      toc_depth: 3
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.tabbed:
      alternate_style: true
  - pymdownx.emoji:
      emoji_index: !!python/name:material.extensions.emoji.twemoji
      emoji_generator: !!python/name:material.extensions.emoji.to_svg

plugins:
  - search

exclude_docs: |
  01_full_architecture_spec.md
  02_on_disk_file_format.md
  03_rust_crate_and_module_layout.md
  04_schema_dsl_spec.md
  05_query_planner_and_execution_spec.md
  06_record_encoding_v1.md
  07_record_encoding_v2.md
  typed_embedded_db_spec.md
  contributing.md
  MODELVAULT_DOCUMENTATION_POSITIONING_MASTER_PLAN.md

# Internal / duplicate specs — not listed in nav (see exclude_docs).
not_in_nav: |
  01_full_architecture_spec.md
  02_on_disk_file_format.md
  03_rust_crate_and_module_layout.md
  04_schema_dsl_spec.md
  05_query_planner_and_execution_spec.md
  06_record_encoding_v1.md
  07_record_encoding_v2.md
  typed_embedded_db_spec.md
  contributing.md
  MODELVAULT_DOCUMENTATION_POSITIONING_MASTER_PLAN.md

nav:
  - Home: index.md
  - Get started:
      - Why ModelVault: guides/why_modelvault.md
      - Quickstart: guides/quickstart.md
      - Choose your path: map.md
      - Core concepts: guides/concepts.md
  - Build:
      - Pydantic: guides/pydantic.md
      - FastAPI: guides/fastapi.md
      - Python: guides/python.md
      - Models & collections: guides/models_and_collections.md
      - Storage modes: guides/storage_modes.md
  - Comparisons:
      - Overview: comparisons/index.md
      - vs SQLite: comparisons/sqlite.md
      - vs JSON files: comparisons/json.md
      - vs TinyDB: comparisons/tinydb.md
      - vs DuckDB: comparisons/duckdb.md
  - Examples: examples/index.md
  - Reference:
      - Python API: reference/python_api.md
      - Rust API: reference/rust_api.md
      - Types & constraints: reference/types.md
      - Compatibility: reference/compatibility.md
      - CLI: reference/cli.md
      - Security: reference/security.md
      - Async policy: reference/async_policy.md
      - 1.0 readiness: reference/readiness.md
  - Operations:
      - Runbook: ops/operations_and_failure_modes.md
      - Debugging & tracing: ops/debugging.md
  - Specifications:
      - Overview: specs/index.md
      - Architecture: specs/full_architecture.md
      - On-disk format: specs/on_disk_file_format.md
      - Format evolution (1.x): specs/format_evolution.md
      - Catalog encoding: specs/catalog_encoding.md
      - Index segments: specs/index_segment_encoding.md
      - Schema DSL: specs/schema_dsl.md
      - Query planner: specs/query_planner.md
      - Record encodings:
          - v1: specs/record_encoding_v1.md
          - v2: specs/record_encoding_v2.md
          - v3: specs/record_encoding_v3.md
      - Rust layout: specs/rust_crate_layout.md
      - Product vision: specs/typed_embedded_db.md
  - Glossary: glossary.md
  - Develop:
      - Contributing: dev/contributing_guide.md
      - Documentation map: dev/documentation_map.md
      - Launch messaging: dev/launch_messaging.md

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/eddiethedean/modelvault
    - icon: fontawesome/brands/python
      link: https://pypi.org/project/modelvault/
    - icon: fontawesome/brands/rust
      link: https://crates.io/crates/modelvault
